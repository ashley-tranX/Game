name: Build Windows installers

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # One build produces three installers: x64, arm64, and a universal one containing both
      - name: Build installers (x64 + arm64 + universal)
        run: npx electron-builder --win --x64 --arm64 --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: StreeFight-windows-installers
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
