<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreeFight</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  .screen {
    position: relative;
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
  }
  canvas {
    width: 100%; height: 100%; display: block; background: #111; outline: none;
    image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated;
  }
  /* CRT scanlines + soft vignette */
  .screen::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.22) 3px, rgba(0,0,0,0) 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.38) 100%);
  }
</style>
</head>
<body>
<div class="screen"><canvas id="c" width="384" height="216" tabindex="0"></canvas></div>
<script src="game.js"></script>
</body>
</html>
